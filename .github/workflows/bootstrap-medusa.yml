name: Bootstrap Medusa Store

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop if Medusa is already initialized
        run: |
          if [ -f apps/backend/package.json ]; then
            echo "Medusa project already exists."
            exit 0
          fi

      - name: Copy official Medusa DTC starter
        run: |
          git clone --depth 1 https://github.com/medusajs/dtc-starter.git "$RUNNER_TEMP/dtc-starter"
          rsync -a --exclude='.git' "$RUNNER_TEMP/dtc-starter/" ./

      - name: Add Codespaces development setup
        shell: bash
        run: |
          mkdir -p .devcontainer

          cat > docker-compose.yml <<'EOF'
          services:
            workspace:
              image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
              command: sleep infinity
              volumes:
                - .:/workspaces/hahahahhadahddhahda:cached
              depends_on:
                db:
                  condition: service_healthy

            db:
              image: postgres:16
              restart: unless-stopped
              environment:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
                POSTGRES_DB: medusa-backend
              volumes:
                - postgres-data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-backend"]
                interval: 5s
                timeout: 5s
                retries: 20

          volumes:
            postgres-data:
          EOF

          cat > .devcontainer/devcontainer.json <<'EOF'
          {
            "name": "Medusa Store",
            "dockerComposeFile": "../docker-compose.yml",
            "service": "workspace",
            "workspaceFolder": "/workspaces/hahahahhadahddhahda",
            "forwardPorts": [8000, 9000],
            "portsAttributes": {
              "8000": { "label": "Storefront", "onAutoForward": "openBrowser" },
              "9000": { "label": "Medusa Admin / API", "onAutoForward": "notify" }
            },
            "remoteEnv": {
              "DATABASE_URL": "postgres://postgres:postgres@db:5432/medusa-backend",
              "STORE_CORS": "http://localhost:8000",
              "ADMIN_CORS": "http://localhost:9000",
              "AUTH_CORS": "http://localhost:8000,http://localhost:9000",
              "NEXT_PUBLIC_MEDUSA_BACKEND_URL": "http://localhost:9000",
              "NEXT_PUBLIC_BASE_URL": "http://localhost:8000",
              "NODE_ENV": "development"
            },
            "customizations": {
              "vscode": {
                "extensions": [
                  "dbaeumer.vscode-eslint",
                  "bradlc.vscode-tailwindcss"
                ]
              }
            },
            "postCreateCommand": "corepack enable && corepack prepare pnpm@10.11.1 --activate && pnpm install"
          }
          EOF

          cat > apps/backend/.env <<'EOF'
          STORE_CORS=http://localhost:8000
          ADMIN_CORS=http://localhost:9000
          AUTH_CORS=http://localhost:8000,http://localhost:9000
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=local-development-jwt-secret
          COOKIE_SECRET=local-development-cookie-secret
          DATABASE_URL=postgres://postgres:postgres@db:5432/medusa-backend
          DB_NAME=medusa-backend
          EOF

          cat > apps/storefront/.env.local <<'EOF'
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=
          NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://localhost:9000
          NEXT_PUBLIC_DEFAULT_REGION=us
          NEXT_PUBLIC_BASE_URL=http://localhost:8000
          NEXT_PUBLIC_STRIPE_KEY=
          NODE_ENV=development
          EOF

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initialize Medusa DTC starter with Codespaces setup" || exit 0
          git push
